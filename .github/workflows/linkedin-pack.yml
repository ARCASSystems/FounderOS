name: LinkedIn Pack Acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Privacy, determinism, contracts, and runner
    runs-on: ubuntu-latest
    # Runs only in the product repository. A founder's own private backup of their OS
    # carries this file too, and must never run the maintainer's checks on their notes.
    if: github.repository == 'ARCASSystems/FounderOS'
    steps:
      - uses: actions/checkout@v4

      - name: Run tracked LinkedIn pack acceptance suite
        run: python3 -m unittest discover -s .github/tests -p "test_*.py" -v
