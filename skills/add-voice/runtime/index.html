<!DOCTYPE html>
<!--
  Founder OS - Tier-0 voice page (the "Add voice" capability, default tier).
  Ears: the browser's built-in speech recognition. Mouth: the browser's built-in
  speech synthesis. Brain: your local server's /brain, which uses the reasoning CLI
  you already run the OS in - no extra API key.

  HONESTY NOTE (load-bearing, not decoration): in Chrome and Edge the built-in speech
  recognition sends your audio to the browser vendor (Google / Microsoft) to transcribe
  it. It needs no key and no payment, but it is NOT local. For fully-local speech, add
  the faster-whisper upgrade documented in the add-voice skill's references/tiers.md.
  The banner below says this on screen so it is never hidden.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Founder OS - voice (Tier 0)</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; padding: 1.5rem; max-width: 720px; margin-inline: auto;
    line-height: 1.5;
  }
  h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
  .sub { opacity: 0.7; font-size: 0.85rem; margin: 0 0 1rem; }
  .banner {
    border: 1px solid #c9a227; background: #fbf4d9; color: #5a4a00;
    padding: 0.7rem 0.9rem; border-radius: 12px; font-size: 0.82rem; margin-bottom: 1rem;
  }
  @media (prefers-color-scheme: dark) {
    .banner { background: #2a2410; color: #e8d48a; border-color: #6b5a1e; }
  }
  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  button {
    font: inherit; padding: 0.6rem 1.1rem; border-radius: 999px; border: 1px solid currentColor;
    background: transparent; cursor: pointer;
  }
  button.primary { background: #1463ff; color: #fff; border-color: #1463ff; }
  button[disabled] { opacity: 0.4; cursor: not-allowed; }
  .panel { border: 1px solid rgba(127,127,127,0.3); border-radius: 12px; padding: 0.9rem; margin-bottom: 0.8rem; }
  .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-bottom: 0.3rem; }
  .you { min-height: 1.4em; }
  .brain { min-height: 1.4em; font-weight: 500; }
  .state { font-size: 0.8rem; opacity: 0.7; height: 1.2em; }
  .fallback { display: none; gap: 0.5rem; margin-top: 0.6rem; }
  .fallback input { flex: 1; font: inherit; padding: 0.5rem; border-radius: 8px; border: 1px solid rgba(127,127,127,0.4); background: transparent; color: inherit; }
  .toggles { margin-top: -6px; }
  .toggles label { font-size: 13px; opacity: 0.9; margin-right: 14px; }
  .toggles label.off { opacity: 0.45; }
  #privacy { font-size: 13px; }
</style>
</head>
<body>
  <h1>Founder OS - voice</h1>
  <p class="sub" id="sub">Tier 0 - the default. No extra key, no paid service. Your one subscription answers.</p>

  <div class="banner" id="banner">
    Checking what is running...
  </div>

  <div class="row">
    <button id="talk" class="primary">Hold to talk</button>
    <button id="save">Save last to brain</button>
    <span class="state" id="state"></span>
  </div>

  <div class="row toggles">
    <label id="sttWrap" title=""><input type="checkbox" id="localStt" disabled> Local ears</label>
    <label id="ttsWrap" title=""><input type="checkbox" id="localTts" disabled> Local voice</label>
    <span class="state" id="privacy"></span>
  </div>

  <div class="panel">
    <div class="label">You said</div>
    <div class="you" id="you"></div>
    <div class="fallback" id="fallback">
      <input id="textin" placeholder="Type here (your browser has no built-in speech recognition)" />
      <button id="send">Ask</button>
    </div>
  </div>

  <div class="panel">
    <div class="label">Brain</div>
    <div class="brain" id="brain"></div>
  </div>

<script>
(function () {
  var youEl = document.getElementById("you");
  var brainEl = document.getElementById("brain");
  var stateEl = document.getElementById("state");
  var talkBtn = document.getElementById("talk");
  var saveBtn = document.getElementById("save");
  var fallback = document.getElementById("fallback");
  var textin = document.getElementById("textin");
  var sendBtn = document.getElementById("send");

  var lastSaid = "";
  var noBrowserEars = false;

  // What is ACTUALLY running, filled from /health. Never assume: the whole point
  // of the local tier is that the page tells the truth about where your voice is
  // going, and a page that says "local" while the audio goes to a browser vendor
  // would be worse than no local tier at all.
  var health = { ears_active: "browser", mouth_active: "browser",
                 local_stt: { available: false }, local_tts: { available: false } };
  var localSttOn = false;
  var localTtsOn = false;

  var bannerEl = document.getElementById("banner");
  var privacyEl = document.getElementById("privacy");
  var sttBox = document.getElementById("localStt");
  var ttsBox = document.getElementById("localTts");
  var sttWrap = document.getElementById("sttWrap");
  var ttsWrap = document.getElementById("ttsWrap");

  function earsAreLocal() { return localSttOn && health.local_stt && health.local_stt.available; }
  function mouthIsLocal() { return localTtsOn && health.local_tts && health.local_tts.available; }

  function renderStatus() {
    var ears = earsAreLocal();
    var mouth = mouthIsLocal();
    // The subtitle names the tier that is actually running. Leaving it on the
    // Tier 0 wording while local ears are on would contradict the banner two
    // lines below it, and the contradiction is the kind a reader believes the
    // reassuring half of.
    document.getElementById("sub").textContent =
      (ears || mouth)
        ? "Tier 0-local. No extra key, no paid service. Your one subscription answers. "
          + (ears ? "Speech stays on this machine" : "Your browser hears")
          + " and " + (mouth ? "a local voice speaks" : "your browser speaks") + "."
        : "Tier 0 - the default. No extra key, no paid service. Your one subscription "
          + "answers; your browser hears and speaks.";
    privacyEl.textContent = ears
      ? "Ears: on this machine"
      : "Ears: your browser vendor";
    bannerEl.textContent = ears
      ? "Local ears are on. Your speech is transcribed on this machine by faster-whisper "
        + "and the audio never leaves it. Answers still come from the reasoning CLI you "
        + "already run, on your own subscription."
      : "Your browser's speech recognition sends your audio to your browser vendor "
        + "(Google or Microsoft) to turn it into text. It needs no key and costs nothing, "
        + "but it is not local. Turn on Local ears to keep speech on this machine. Your "
        + "brain - your files and answers - stays here either way.";
  }

  function setState(s) { stateEl.textContent = s || ""; }

  var currentAudio = null;

  function speakInBrowser(text) {
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0;
      window.speechSynthesis.speak(u);
    } catch (e) { /* no mouth available - the text on screen is the fallback */ }
  }

  function speak(text) {
    if (!mouthIsLocal()) { speakInBrowser(text); return; }
    // Local voice. If Piper cannot answer, fall straight back to the browser
    // rather than leaving the turn silent.
    fetch("/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    }).then(function (r) {
      if (!r.ok) throw new Error("speak failed");
      var ct = r.headers.get("Content-Type") || "";
      if (ct.indexOf("audio") === -1) throw new Error("no audio");
      return r.blob();
    }).then(function (blob) {
      stopSpeaking();
      currentAudio = new Audio(URL.createObjectURL(blob));
      currentAudio.play();
    }).catch(function () {
      // Turn the claim off AND lock it off. Flipping the flag without disabling
      // the box left the claim one click from coming back, because the cached
      // health said the mouth was available and nothing ever re-read it. The
      // ears disable their box on failure; the mouth has to as well.
      localTtsOn = false;
      try { ttsBox.checked = false; } catch (e) {}
      renderStatus();
      setState("local voice failed - using the browser");
      speakInBrowser(text);
      refreshHealth();
    });
  }
  function stopSpeaking() {
    try { window.speechSynthesis.cancel(); } catch (e) {}
    try { if (currentAudio) { currentAudio.pause(); currentAudio = null; } } catch (e) {}
  }

  // Ask the brain. Backchannel so a slow turn is never silent (concurrency principle:
  // the front keeps the user engaged while the back works).
  function askBrain(text) {
    lastSaid = text;
    youEl.textContent = text;
    brainEl.textContent = "";
    setState("thinking...");
    var spokeBackchannel = false;
    var timer = setTimeout(function () {
      spokeBackchannel = true;
      speak("Give me a moment.");
    }, 650);

    fetch("/brain", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    }).then(function (r) { return r.json(); })
      .then(function (data) {
        clearTimeout(timer);
        if (spokeBackchannel) stopSpeaking();
        var answer = (data && data.answer) || "No answer.";
        brainEl.textContent = answer;
        setState(data && data.latency_ms ? (Math.round(data.latency_ms) + " ms") : "");
        speak(answer);
      })
      .catch(function (err) {
        clearTimeout(timer);
        brainEl.textContent = "Could not reach the local server. Is it running?";
        setState("offline");
      });
  }

  function saveLast() {
    if (!lastSaid) { setState("nothing to save yet"); return; }
    setState("saving...");
    fetch("/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: lastSaid })
    }).then(function (r) { return r.json(); })
      .then(function (data) {
        var msg = (data && data.answer) || "Saved.";
        brainEl.textContent = msg;
        setState("");
        speak(msg);
      })
      .catch(function () { setState("save failed - server offline?"); });
  }
  saveBtn.addEventListener("click", saveLast);

  // Local ears: record with MediaRecorder and POST the audio to /transcribe,
  // where faster-whisper turns it into text on this machine. Opt-in, because it
  // needs a package Tier 0 deliberately does not install.
  var mediaRecorder = null;
  var chunks = [];

  function startLocalRecording() {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setState("this browser cannot record audio - local ears switched off, press again to use your browser's ears");
      localSttOn = false; sttBox.checked = false; renderStatus();
      return;
    }
    stopSpeaking();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        var blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
        if (!blob.size) { setState(""); return; }
        setState("transcribing on this machine...");
        fetch("/transcribe", {
          method: "POST",
          headers: { "Content-Type": blob.type },
          body: blob
        }).then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.ok && data.text) {
              youEl.textContent = data.text;
              setState("");
              askBrain(data.text);
            } else {
              setState("local ears: " + ((data && data.reason) || "no text"));
              // The server tells us when the ears it advertised cannot work.
              // Re-read the truth rather than keep painting the claim.
              if (data && data.recheck) { refreshHealth(); }
            }
          })
          .catch(function () { setState("transcribe failed - server offline?"); });
      };
      mediaRecorder.start();
      setState("listening (local)...");
      talkBtn.textContent = "Listening - release to ask";
    }).catch(function (err) {
      setState("mic blocked: " + (err && err.name ? err.name : "permission denied"));
      talkBtn.textContent = "Hold to talk";
    });
  }

  function stopLocalRecording() {
    try { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); } catch (e) {}
    mediaRecorder = null;
    talkBtn.textContent = "Hold to talk";
  }

  // Ears: the browser's built-in speech recognition, if present.
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    var rec = new SR();
    rec.lang = "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    var finalText = "";

    rec.onresult = function (ev) {
      var interim = "";
      finalText = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finalText += t; else interim += t;
      }
      youEl.textContent = finalText || interim;
    };
    rec.onerror = function (ev) { setState("mic error: " + ev.error); };
    rec.onend = function () {
      talkBtn.textContent = "Hold to talk";
      if (finalText.trim()) askBrain(finalText.trim());
    };

    var listening = false;
    function startListening() {
      if (earsAreLocal()) { startLocalRecording(); return; }
      if (listening) return;
      listening = true; finalText = "";
      stopSpeaking();
      setState("listening...");
      talkBtn.textContent = "Listening - release to ask";
      try { rec.start(); } catch (e) {}
    }
    function stopListening() {
      if (earsAreLocal()) { stopLocalRecording(); return; }
      if (!listening) return;
      listening = false;
      try { rec.stop(); } catch (e) {}
    }
    // press-and-hold (mouse + touch)
    talkBtn.addEventListener("mousedown", startListening);
    talkBtn.addEventListener("mouseup", stopListening);
    talkBtn.addEventListener("mouseleave", stopListening); // releasing off the button still stops
    talkBtn.addEventListener("touchstart", function (e) { e.preventDefault(); startListening(); });
    talkBtn.addEventListener("touchend", function (e) { e.preventDefault(); stopListening(); });
  } else {
    // No built-in speech recognition (Firefox, Safari). The local ears still
    // work here if faster-whisper is installed, because they need a microphone
    // and not a vendor service - which makes this browser the case the local
    // tier helps most, not least.
    fallback.style.display = "flex";
    talkBtn.addEventListener("mousedown", function () { if (earsAreLocal()) startLocalRecording(); });
    talkBtn.addEventListener("mouseup", function () { if (earsAreLocal()) stopLocalRecording(); });
    talkBtn.addEventListener("touchstart", function (e) {
      if (!earsAreLocal()) return; e.preventDefault(); startLocalRecording(); });
    talkBtn.addEventListener("touchend", function (e) {
      if (!earsAreLocal()) return; e.preventDefault(); stopLocalRecording(); });
    noBrowserEars = true;
  }

  function sendTyped() {
    var t = (textin.value || "").trim();
    if (t) { askBrain(t); textin.value = ""; }
  }
  sendBtn.addEventListener("click", sendTyped);
  textin.addEventListener("keydown", function (e) { if (e.key === "Enter") sendTyped(); });

  function wireToggle(box, wrap, status, label, onChange) {
    if (status && status.available) {
      box.disabled = false;
      wrap.title = label + " runs on this machine.";
      box.addEventListener("change", onChange);
    } else {
      box.disabled = true;
      wrap.className = "off";
      var why = (status && status.reason) || "not available";
      var how = (status && status.how) ? " - " + status.how : "";
      wrap.title = label + " is off: " + why + how;
    }
  }

  // Say what is running, not what could be. Everything the page claims about
  // where your voice goes comes from here, and it can be re-read at any time:
  // a tier can stop working mid-session, and a stale claim about where your
  // audio goes is the one thing this page must not hold on to.
  function refreshHealth() {
    return fetch("/health").then(function (r) { return r.json(); }).then(function (h) {
      if (!h) return;
      health = h;
      if (!(h.local_stt && h.local_stt.available)) {
        localSttOn = false;
        try { sttBox.checked = false; sttBox.disabled = true; sttWrap.className = "off"; } catch (e) {}
        if (h.local_stt && h.local_stt.reason) { sttWrap.title = "Local ears is off: " + h.local_stt.reason; }
      }
      if (!(h.local_tts && h.local_tts.available)) {
        localTtsOn = false;
        try {
          ttsBox.checked = false;
          ttsBox.disabled = true;
          ttsWrap.className = "off";
        } catch (e) {}
        if (h.local_tts && h.local_tts.reason) {
          ttsWrap.title = "Local voice is off: " + h.local_tts.reason;
        }
      }
      renderStatus();
    }).catch(function () {});
  }

  fetch("/health").then(function (r) { return r.json(); }).then(function (h) {
    if (!h) return;
    health = h;
    if (h.brain_available === false) {
      brainEl.textContent =
        "Ready to hear you and save to your brain. Conversational answers need the reasoning " +
        "CLI on this machine's PATH - see the troubleshooting note. Saving works now.";
    }
    wireToggle(sttBox, sttWrap, h.local_stt, "Local ears", function () {
      localSttOn = sttBox.checked;
      renderStatus();
    });
    wireToggle(ttsBox, ttsWrap, h.local_tts, "Local voice", function () {
      localTtsOn = ttsBox.checked;
      renderStatus();
    });
    // config.json can start them on; the checkbox then reflects reality.
    if (h.ears_active === "local") { sttBox.checked = true; localSttOn = true; }
    if (h.mouth_active === "local") { ttsBox.checked = true; localTtsOn = true; }
    if (noBrowserEars && !(h.local_stt && h.local_stt.available)) {
      talkBtn.disabled = true;
      talkBtn.textContent = "No mic STT in this browser";
    }
    renderStatus();
  }).catch(function () { renderStatus(); });
})();
</script>
</body>
</html>
